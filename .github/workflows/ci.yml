# CI for Dealers Choice. See docs/dev/handbook.md §6 for what each job guards and how to
# diagnose failures.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 7 * * *" # nightly, 07:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Both OSes: determinism (NFR-1) must hold across platforms, and bundled SQLite/zstd
    # must build on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web:
    # The React client (docs/tech/web.md): the generated protocol samples and view gallery must
    # be up to date (cargo test rewrites them), protocol.ts must fit them, and the app must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p protocol -p server
      - run: git diff --exit-code web/src/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    # The deploy image builds (FR-WB-10). Tags only, to keep pull requests fast.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t dealers-choice .

  nightly:
    # Slow, release-mode checks: the exhaustive 7-card evaluator test (133,784,560 hands),
    # throughput benchmarks, and the data-rate table. Runs on schedule or by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release -- --ignored --nocapture
      - run: cargo run --release -p cli --bin dc -- bench-sim --deals 2000 | tee bench.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_id }}
          path: bench.md
