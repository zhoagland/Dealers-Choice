[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata: each crate writes `edition.workspace = true` etc. to inherit these.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Pin dependency versions once here; crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
smallvec = { version = "1", features = ["serde", "union", "const_generics"] }
